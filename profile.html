<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taply</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="profile-page">
  <main class="public-profile">
<section class="profile-header">
  <div class="public-avatar" id="profileAvatar">
    <span>T</span>
  </div>
  <h1 id="profileName">Taply User</h1>
  <p id="profileUsername">@username</p>
  <p id="profileBio"></p>
</section>
<section id="publicLinks" class="public-links">
  <div class="profile-loading">
    Loading profile...
  </div>
</section>
<a href="signup.html" class="join-taply">
  <span>✨</span>
  <span>Create your own Taply</span>
  <span>→</span>
</a>
<footer class="profile-footer">
  <a href="index.html" class="taply-logo">
    taply<span>.</span>
  </a>
</footer>
  </main>
  <script src="js/profile.js"></script>
</body>
</html>
